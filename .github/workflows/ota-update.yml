name: OTA Update (EAS Update)

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/nastech-app/sources/**'
      - 'packages/nastech-app/assets/**'
      - 'packages/nastech-app/package.json'
      - 'packages/nastech-app/app.config.js'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch to publish to'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      message:
        description: 'Update message (optional)'
        required: false
        default: ''

jobs:
  ota:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-ota-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-ota-
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_NASTECH_WIRE_BUILD: "1"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set update message
        id: msg
        run: |
          if [ -n "${{ github.event.inputs.message }}" ]; then
            echo "MESSAGE=${{ github.event.inputs.message }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            COMMIT_MSG=$(git log -1 --pretty=format:'%s' | head -c 100)
            echo "MESSAGE=${SHORT_SHA}: ${COMMIT_MSG}" >> $GITHUB_OUTPUT
          fi

      - name: Set target branch
        id: branch
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          else
            echo "BRANCH=production" >> $GITHUB_OUTPUT
          fi

      - name: Set APP_ENV
        id: appenv
        run: |
          BRANCH="${{ steps.branch.outputs.BRANCH }}"
          if [ "$BRANCH" = "production" ]; then
            echo "APP_ENV=production" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "preview" ]; then
            echo "APP_ENV=preview" >> $GITHUB_OUTPUT
          else
            echo "APP_ENV=development" >> $GITHUB_OUTPUT
          fi

      - name: Publish OTA update
        working-directory: packages/nastech-app
        run: |
          eas update \
            --branch "${{ steps.branch.outputs.BRANCH }}" \
            --message "${{ steps.msg.outputs.MESSAGE }}" \
            --platform all \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: ${{ steps.appenv.outputs.APP_ENV }}
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"

      - name: Summary
        run: |
          echo "## OTA Update Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.branch.outputs.BRANCH }}" >> $GITHUB_STEP_SUMMARY
          echo "**Message:** ${{ steps.msg.outputs.MESSAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Installed apps on the **${{ steps.branch.outputs.BRANCH }}** channel will receive this update automatically on next launch." >> $GITHUB_STEP_SUMMARY
