name: Build Android + iOS

on:
  workflow_dispatch:
    inputs:
      android_profile:
        description: 'Android EAS build profile'
        required: false
        default: 'android-apk'
        type: choice
        options:
          - android-apk
          - preview
      ios_profile:
        description: 'iOS EAS build profile'
        required: false
        default: 'preview-store'
        type: choice
        options:
          - preview-store
          - production

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (required for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_NASTECH_WIRE_BUILD: "1"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: packages/nastech-app
        run: eas build -p android --profile ${{ github.event.inputs.android_profile || 'android-apk' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get APK URL
        working-directory: packages/nastech-app
        run: |
          BUILD_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | node -e "const d=[];process.stdin.on('data',c=>d.push(c));process.stdin.on('end',()=>{const b=JSON.parse(d.join(''))[0];console.log(b?.artifacts?.buildUrl||b?.artifactUrl||'');});")
          echo "APK_URL=${BUILD_URL}" >> $GITHUB_ENV
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Summary
        run: |
          echo "## Android APK" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ github.event.inputs.android_profile || 'android-apk' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** ${{ env.APK_URL }}" >> $GITHUB_STEP_SUMMARY

  ios:
    name: iOS IPA
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (required for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_NASTECH_WIRE_BUILD: "1"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA
        working-directory: packages/nastech-app
        run: eas build -p ios --profile ${{ github.event.inputs.ios_profile || 'preview-store' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get IPA URL
        working-directory: packages/nastech-app
        run: |
          BUILD_URL=$(eas build:list --platform ios --limit 1 --json --non-interactive | node -e "const d=[];process.stdin.on('data',c=>d.push(c));process.stdin.on('end',()=>{const b=JSON.parse(d.join(''))[0];console.log(b?.artifacts?.buildUrl||b?.artifactUrl||'');});")
          echo "IPA_URL=${BUILD_URL}" >> $GITHUB_ENV
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Summary
        run: |
          echo "## iOS IPA" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ github.event.inputs.ios_profile || 'preview-store' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** ${{ env.IPA_URL }}" >> $GITHUB_STEP_SUMMARY
