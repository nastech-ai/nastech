name: Build Android + iOS

on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.11.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: packages/nastech-app
        run: eas build -p android --profile android-apk --non-interactive

      - name: Get APK URL
        working-directory: packages/nastech-app
        run: |
          BUILD_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          echo "APK_URL=$BUILD_URL" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "## ✅ Android APK" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** $APK_URL" >> $GITHUB_STEP_SUMMARY

  ios:
    name: iOS IPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.11.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA
        working-directory: packages/nastech-app
        run: eas build -p ios --profile preview --non-interactive

      - name: Get IPA URL
        working-directory: packages/nastech-app
        run: |
          BUILD_URL=$(eas build:list --platform ios --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          echo "IPA_URL=$BUILD_URL" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "## ✅ iOS IPA" >> $GITHUB_STEP_SUMMARY
          echo "**Download:** $IPA_URL" >> $GITHUB_STEP_SUMMARY
