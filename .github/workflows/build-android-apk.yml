name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'android-apk'
        type: choice
        options:
          - android-apk
          - preview

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (required for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SKIP_NASTECH_WIRE_BUILD: "1"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: packages/nastech-app
        run: eas build -p android --profile ${{ github.event.inputs.profile || 'android-apk' }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get APK download URL
        working-directory: packages/nastech-app
        run: |
          BUILD_URL=$(eas build:list --platform android --limit 1 --json --non-interactive | node -e "const d=[];process.stdin.on('data',c=>d.push(c));process.stdin.on('end',()=>{const b=JSON.parse(d.join(''))[0];console.log(b?.artifacts?.buildUrl||b?.artifactUrl||'');});")
          echo "APK_URL=${BUILD_URL}" >> $GITHUB_ENV
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build summary
        run: |
          echo "## Android APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ github.event.inputs.profile || 'android-apk' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK Download:** ${{ env.APK_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or visit [expo.dev/builds](https://expo.dev/accounts/nastechai/projects/nastech/builds) to download" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nastech-apk-${{ github.run_number }}
          name: "NasTech APK - Build #${{ github.run_number }}"
          body: |
            ## NasTech Android APK

            Built from commit: ${{ github.sha }}
            Profile: ${{ github.event.inputs.profile || 'android-apk' }}

            **APK Download (from EAS):** ${{ env.APK_URL }}

            Visit [expo.dev/builds](https://expo.dev/accounts/nastechai/projects/nastech/builds) for more details.
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
