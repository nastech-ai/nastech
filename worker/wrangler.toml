# NasTech Cloudflare Workers — deploy each worker with its own config file.
#
# Commands (run from the worker/ directory):
#
#   npx wrangler deploy --config wrangler.api.toml      → api.nastech.workers.dev
#   npx wrangler deploy --config wrangler.ai.toml       → ai.nastech.workers.dev
#   npx wrangler deploy --config wrangler.privacy.toml  → privacy.nastech.workers.dev
#   npx wrangler deploy --config wrangler.ba.toml       → ba.nastech.workers.dev
#
# IMPORTANT: After deploying api-worker, set BACKEND_URL in the Cloudflare dashboard:
#   Workers & Pages → nastech-api → Settings → Variables and Secrets
#   Add: BACKEND_URL = https://your-nastech-server.com
